</div>
<script>
// Talks to the Host as an MCP App: a handshake, then the Deck service's tools
// called through the Host. The Session is the one the Host opened this tab
// in, which the Deck service reads from each call; the page passes the id it
// gave back to deck_map only, to say which Session asks.
;(async () => {
  const $ = id => document.getElementById(id)

  let lastId = 0
  const waiting = new Map()
  const post = message => window.parent.postMessage({ jsonrpc: '2.0', ...message }, '*')
  const request = (method, params) =>
    new Promise((resolve, reject) => {
      const id = ++lastId
      waiting.set(id, { resolve, reject })
      post({ id, method, params })
    })

  // Dark or light as the Host is: its context names the theme in the
  // handshake, and again in a change of it. The theme is written on the body:
  // the root element's data-theme is the Host's, which writes its own light or
  // dark there.
  const follow = context => {
    if (context?.theme === 'light') document.body.dataset.theme = 'deck-light'
    if (context?.theme === 'dark') document.body.dataset.theme = 'deck'
  }

  window.addEventListener('message', ({ source, data }) => {
    if (source !== window.parent || data?.jsonrpc !== '2.0') return
    if (data.method === 'ui/notifications/host-context-changed') follow(data.params)
    if (data.method !== undefined) {
      if (data.id !== undefined) post({ id: data.id, result: {} })
      return
    }
    const call = waiting.get(data.id)
    if (call === undefined) return
    waiting.delete(data.id)
    if (data.error) call.reject(new Error(data.error.message))
    else call.resolve(data.result)
  })

  // A tool of the Deck service; one that fails throws its message.
  const callTool = async (name, args = {}) => {
    const result = await request('tools/call', { name, arguments: args })
    if (result.isError) throw new Error(result.content?.[0]?.text ?? `${name} failed`)
    return result.structuredContent
  }

  // What the last read came to: the time it came back, 'failed', or
  // undefined while there is nothing read to say how fresh it is. The head
  // writes it here alone, its text and its two classes together.
  let readAt
  const showFreshness = () => {
    const fresh = $('fresh')
    const minutes = typeof readAt === 'number' ? Math.floor(Math.max(0, Date.now() - readAt) / 60_000) : undefined
    fresh.textContent =
      readAt === 'failed' ? '读取失败'
      : minutes === undefined ? ''
      : minutes === 0 ? '刚刚'
      : minutes < 60 ? `${minutes} 分钟前`
      : `${Math.floor(minutes / 60)} 小时前`
    fresh.classList.toggle('is-failed', readAt === 'failed')
    fresh.classList.toggle('is-stale', minutes > 10)
  }
  setInterval(showFreshness, 30_000)

  // An element of the class, holding the children, a space between each.
  const el = (tag, className, ...children) => {
    const element = document.createElement(tag)
    element.className = className
    children.forEach((child, index) => element.append(...(index > 0 ? [' ', child] : [child])))
    return element
  }

  const GROUPS = ['ready', 'inProgress', 'blocked', 'done']
  const GROUP_TITLE = { ready: '可执行', inProgress: '进行中', blocked: '阻塞', done: '已完成' }
  const TRIAGE_LABELS = ['needs-triage', 'needs-info', 'ready-for-agent', 'ready-for-human', 'wontfix']
  const WAITING_LABELS = ['needs-triage', 'needs-info']
  const HOST_NAME = { 'claude-code': 'Claude Code', codex: 'Codex' }
  // What an empty list says under each filter: a fact and where to go.
  const EMPTY = {
    all: ['Task Source 里还没有 Task。', '在 Session 里用 Matt skills 建立。'],
    ready: ['没有可执行的 Task。', '到“下一步”问该做什么。'],
    inProgress: ['没有进行中的 Task。', '点上面的筛选看别的分组。'],
    blocked: ['没有被阻塞的 Task。', '点上面的筛选看别的分组。'],
    done: ['还没有已完成的 Task。', '点上面的筛选看别的分组。'],
  }
  // Why the Task Source could not be read, by the kind the Deck service
  // gives: the Pane's own words, some of them code, and the reason it was
  // given, as text.
  const code = text => el('code', '', text)
  const FAILURE = {
    unauthenticated: () => [code('gh'), ' 未登录。运行 ', code('gh auth login'), ' 后点“刷新”重试。'],
    offline: () => ['连不上 GitHub。检查网络后点“刷新”重试。'],
    'gh-missing': () => ['找不到 ', code('gh'), ' 命令。安装 GitHub CLI 后点“刷新”重试。'],
    'no-repository': () => ['这个 Workspace 没有指向 GitHub 的 remote，读不到 Issues。'],
    failed: message => [code('gh'), ` 出错：${message}。点“刷新”重试。`],
  }
  // A row's state: the glyph's name and its path.
  const PLATE = {
    ready: ['可执行', '<path d="M8 2.1 13.9 8 8 13.9 2.1 8z" fill="none" stroke="currentColor" stroke-width="1.6"/>'],
    running: ['进行中 · 本 Session', '<path d="M4 2.5 13.5 8 4 13.5z" fill="currentColor"/>'],
    other: ['进行中 · 其他 Session', '<circle cx="8" cy="8" r="5.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 2.4a5.6 5.6 0 0 0 0 11.2z" fill="currentColor"/>'],
    orphaned: ['Orphaned', '<path d="M8 2 14.6 13.5H1.4z" fill="currentColor"/>'],
    blocked: ['被阻塞', '<rect x="3.2" y="3.2" width="9.6" height="9.6" fill="none" stroke="currentColor" stroke-width="1.6"/>'],
    closed: ['已解锁', '<path d="M8 1 15 8 8 15 1 8z" fill="currentColor"/>'],
    closeout: ['Pending Closeout', '<path d="M8 1.6 14.4 8 8 14.4 1.6 8z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 5.2 10.8 8 8 10.8 5.2 8z" fill="currentColor"/>'],
  }
  const plate = state => {
    const [label, paths] = PLATE[state]
    const element = el('span', `dk-plate is-${state}`)
    element.setAttribute('role', 'img')
    element.setAttribute('aria-label', label)
    element.innerHTML = `<svg viewBox="0 0 16 16" aria-hidden="true">${paths}</svg>`
    return element
  }
  // The element, its glyph before what it says.
  const glyphed = (element, paths) => {
    element.insertAdjacentHTML('afterbegin', `<svg viewBox="0 0 16 16" aria-hidden="true">${paths}</svg>`)
    return element
  }
  const CHECK = '<path d="M2.8 8.6 6.4 12.2 13.2 4.4" fill="none" stroke="currentColor" stroke-width="1.8"/>'
  const pad = n => String(n).padStart(2, '0')
  // A closing time in the local time zone: `11-22 01:40`.
  const shortTime = at => {
    const date = new Date(at)
    return `${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`
  }

  // The Session this tab is in, the last list the Deck service gave, and the
  // filter's choice: all, or one group.
  let session
  let list
  let filter = 'all'

  // A Task's state in the group the Deck service put it in; in progress, by
  // the Session holding it.
  const stateOf = (task, group) =>
    group === 'inProgress'
      ? task.isOrphaned ? 'orphaned' : task.occupant === session.session ? 'running' : 'other'
      : { ready: 'ready', blocked: 'blocked', done: 'closed' }[group]

  // A row: the glyph, the number and title, then what it says of itself.
  const row = (task, state, className, before, after, meta, aside) =>
    el('li', `dk-row is-${state}${className}`, plate(state), el('div', 'dk-row__main',
      el('div', 'dk-row__line', ...before, el('span', `dk-id is-${state}`, `#${task.number}`), el('span', 'dk-row__title heading', task.title), ...after),
      el('div', 'dk-row__line', el('span', 'dk-row__meta caption', ...meta), ...aside)))

  // What a Task's row says of its state, and the detail's badge.
  const statusOf = (task, state) =>
    ({
      ready: [el('span', '', '可执行')],
      running: [el('span', '', '进行中 · 本 Session')],
      // Another Session of this Host by its cut-short id alone, one of the
      // other Host after the Host's name.
      other: [el('span', '', `进行中 ·${task.occupantHost === session.sessionHost ? '' : ` ${HOST_NAME[task.occupantHost]}`}`, el('span', 'mono', task.occupantShort))],
      orphaned: [el('span', 'is-warn', 'Orphaned')],
      blocked: task.blockers.length > 0 ? [el('span', '', `被 ${task.blockers.map(number => `#${number}`).join(' ')} 阻塞`)] : [],
      closed: [el('span', 'is-unlock', '已解锁')],
    })[state]
  // Blocked by no Task, a Task waits on the label that puts it there; else it
  // shows its first triage label.
  const labelOf = (task, state) =>
    state === 'blocked' && task.blockers.length === 0
      ? task.labels.find(each => WAITING_LABELS.includes(each))
      : task.labels.find(each => TRIAGE_LABELS.includes(each))

  // The actions of a Task as it is held: this Session's is released; another
  // Session's taken over, asked in the place `place`; an Orphaned one either.
  const heldActions = (task, state, place) =>
    state === 'running' ? [releaseButton(task.number, task.occupant)]
    : state === 'other' ? [takeOverButton(task.number, place)]
    : state === 'orphaned' ? [takeOverButton(task.number, place), releaseButton(task.number, task.occupant)]
    : []

  const taskRow = (task, group) => {
    const state = stateOf(task, group)
    // Asked to take it over, the row's place holds the asking.
    if (isAsked(task, state, 'tasks')) return el('li', '', takeOverAsk(task, state))
    const status = statusOf(task, state)
    if (state === 'closed' && task.hasEvidence) status.push(glyphed(el('span', 'is-pass', '验收证据'), CHECK))
    const label = labelOf(task, state)
    const meta = [...status, ...(label === undefined ? [] : [el('span', 'dk-tag', label)])]
    const actions = state === 'ready' ? [executeButton(task.number, '执行', 'dk-btn dk-btn--sm dk-btn--go')] : heldActions(task, state, 'tasks')
    const aside =
      state === 'closed' && task.closedAt !== null ? [el('span', 'dk-row__aside caption', shortTime(task.closedAt))]
      : actions.length > 0 ? [el('span', 'dk-row__actions', ...actions)]
      : []
    const element = row(task, state, '', [], [], meta, aside)
    element.addEventListener('click', () => openTask(task.number))
    return element
  }

  // Every Task of the list with the group it stands in; a Spec or Map where
  // it stands as a Task.
  const entries = () => [
    ...list.containers.map(each => [each, each.group]),
    ...GROUPS.flatMap(group => list.groups[group].map(each => [each, group])),
  ]
  // A Spec's or Map's direct Child Tasks, each with the group it stands in.
  const childrenOf = container => entries().filter(([child]) => child.parent === container.number)

  // A Spec's or Map's glyph: by its direct Child Tasks in progress, else as
  // a Task's (docs/pane-layout.md).
  const containerState = container => {
    const inProgress = childrenOf(container).filter(([, group]) => group === 'inProgress').map(([child]) => child)
    return container.isPendingCloseout
      ? 'closeout'
      : inProgress.some(child => child.isOrphaned)
        ? 'orphaned'
        : inProgress.some(child => child.occupant === session.session)
          ? 'running'
          : inProgress.length > 0 ? 'other' : stateOf(container, container.group)
  }

  // A Spec or Map: its glyph, its progress, its Child Tasks by group, then
  // the actions given; clicked, its detail unless told otherwise.
  const containerRow = (container, actions, onClick = () => openTask(container.number)) => {
    const children = childrenOf(container)
    const inGroup = group => children.filter(([, each]) => each === group).map(([child]) => child)
    const state = containerState(container)
    const { closed, total } = container.progress
    const ring = el('span', `dk-ring${container.isPendingCloseout ? ' is-complete' : ''}`, `${closed}/${total}`)
    ring.insertAdjacentHTML('afterbegin', `<svg viewBox="0 0 16 16" aria-hidden="true"><circle class="dk-ring__track" cx="8" cy="8" r="6"/><circle class="dk-ring__arc" cx="8" cy="8" r="6" stroke-dasharray="${total === 0 ? 0 : ((37.7 * closed) / total).toFixed(2)} 37.70"/></svg>`)
    const meta = container.isPendingCloseout
      ? [el('span', 'is-unlock', '待收尾核对')]
      : [el('span', '', ['ready', 'inProgress', 'blocked'].map(group => `${inGroup(group).length} ${GROUP_TITLE[group]}`).join(' · '))]
    const element = row(container, state, ' dk-row--container', [el('span', 'dk-kind label', container.kind === 'spec' ? 'Spec' : 'Map')], [ring], meta, actions)
    element.addEventListener('click', onClick)
    return element
  }

  // The list as the filter shows it: under "all", the open Specs and Maps,
  // then each group that has Tasks, past five rows its first five and a
  // button to the rest; one group alone, all of it.
  const showTasks = () => {
    for (const chip of $('filter').children) {
      const chosen = chip.dataset.filter
      chip.setAttribute('aria-pressed', String(chosen === filter))
      chip.querySelector('.mono').textContent = chosen === 'all'
        ? GROUPS.reduce((sum, group) => sum + list.groups[group].length, 0)
        : list.groups[chosen].length
    }
    const containers = filter === 'all' ? list.containers.filter(container => container.isOpen) : []
    $('containers').replaceChildren(
      ...containers.map(container => {
        const open = smallButton('地图')
        // Its own: a click on it is no click on the row, which opens the detail.
        open.addEventListener('click', event => {
          event.stopPropagation()
          openMap(container.number)
        })
        const closeout = container.isPendingCloseout ? [closeoutButton(closeoutOf(container.number), 'dk-btn dk-btn--sm dk-btn--unlock')] : []
        return containerRow(container, [el('span', 'dk-row__actions', ...closeout, open)])
      }),
    )
    $('containers').hidden = containers.length === 0
    const groups = (filter === 'all' ? GROUPS : [filter]).filter(group => list.groups[group].length > 0)
    $('groups').replaceChildren(
      ...groups.map(group => {
        const tasks = list.groups[group]
        const shown = filter === 'all' ? tasks.slice(0, 5) : tasks
        const section = el('section', 'dk-group')
        if (filter === 'all') {
          section.append(el('header', 'dk-group__head', el('span', 'label', GROUP_TITLE[group]), el('span', 'dk-group__count mono', String(tasks.length))))
        }
        section.append(el('ul', 'dk-list', ...shown.map(task => taskRow(task, group))))
        if (shown.length < tasks.length) {
          const more = el('button', 'dk-group__more caption', `还有 ${tasks.length - shown.length} 个`)
          more.type = 'button'
          more.addEventListener('click', () => {
            filter = group
            showTasks()
          })
          section.append(more)
        }
        return section
      }),
    )
    const isEmpty = containers.length === 0 && groups.length === 0
    $('tasks-empty').hidden = !isEmpty
    if (isEmpty) {
      const [fact, where] = EMPTY[filter]
      $('tasks-empty').children[0].textContent = fact
      $('tasks-empty').children[1].textContent = where
    }
    $('filter').hidden = false
  }
  for (const chip of $('filter').children) {
    chip.addEventListener('click', () => {
      filter = chip.dataset.filter
      showTasks()
    })
  }

  // Entering and going back (docs/codex-tab-layout.md, "进入和返回"), for every
  // view that drills in. What is entered replaces the content of the tab it is
  // entered from, under the way back; the head and the tabs stay. The way is
  // kept here, outside the DOM each read draws again: `tab`, the tab it starts
  // from, and `steps`, the last one shown. Leaving the tab leaves the way.
  //
  // A view enters a step with enter({ crumb, draw, drawn }) from its tab's
  // content or from the step shown: `crumb` names it in the way ('#70',
  // '$implement'); `draw` reads what it shows and answers { end, body }, the
  // elements at the end of the bar and its content; `drawn` is what it shows
  // until the first drawing answers; `withTasks`, whether it is drawn from the
  // Tasks. A step draws as it is entered, as the way goes back to it, and with
  // "刷新"; drawn from the Tasks, with each read of them too. What it drew last
  // stays until the next drawing answers. "返回" goes back one step, to where
  // the page was scrolled when it was entered.
  let into
  const chosenTab = () => tabs.find(tab => tab.getAttribute('aria-selected') === 'true').dataset.tab
  const enter = step => {
    closeTakeOver()
    into ??= { tab: chosenTab(), steps: [] }
    into.steps.push({ ...step, left: window.scrollY })
    showPanel()
    window.scrollTo(0, 0)
    drawStep()
  }
  const back = () => {
    const { left } = into.steps.pop()
    if (into.steps.length === 0) into = undefined
    showPanel()
    // What the step drew last is shown before the page scrolls to where it
    // was: a browser stops a scroll at the end of what is shown.
    drawStep()
    window.scrollTo(0, left)
  }
  // What the step drew last; over it, a Task's detail holds the asking to
  // take it over, where it was asked there.
  const showStep = step => {
    $('into-end').replaceChildren(...step.drawn.end)
    const found = takeover?.place === 'detail' ? entries().find(([each]) => each.number === step.task) : undefined
    const state = found && stateOf(...found)
    $('into-body').replaceChildren(...(found !== undefined && isAsked(found[0], state, 'detail') ? [takeOverAsk(found[0], state)] : []), ...step.drawn.body)
    // Drawn while another step was shown, its "执行" goes by the skills
    // read since.
    showExecutable()
  }
  // The step shown: the way to it, what it drew last, then what it draws now.
  const drawStep = async () => {
    if (into === undefined) return
    const step = into.steps.at(-1)
    const way = [tabs.find(tab => tab.dataset.tab === into.tab).textContent, ...into.steps.slice(0, -1).map(each => each.crumb)]
    $('crumbs').replaceChildren(`${way.join(' / ')} / `, el('b', '', step.crumb))
    showStep(step)
    step.drawn = await step.draw()
    if (into?.steps.at(-1) === step) showStep(step)
  }

  // The detail of the Task `number`, entered from its row or from the detail
  // shown. What the list knows of it (its state, what blocks it) comes from
  // the list, the rest from its own read.
  const openTask = number =>
    enter({ crumb: `#${number}`, task: number, withTasks: true, draw: () => drawTask(number), drawn: { end: [], body: [el('p', 'dk-why', `正在读取 #${number}…`)] } })

  const drawTask = async number => {
    let answer
    let failure
    try {
      answer = await callTool('deck_task', { number })
      if (!answer.ok) failure = FAILURE[answer.failure.kind](answer.failure.message)
    } catch (error) {
      failure = [`Deck 服务出错：${error.message}。点“刷新”重试。`]
    }
    if (failure !== undefined) {
      const notice = failedNotice(`读取 #${number} 失败`, '')
      notice.querySelector('.dk-notice__text').replaceChildren(...failure)
      return { end: [], body: [notice] }
    }
    const { task, reports } = answer
    const entryOf = wanted => entries().find(([each]) => each.number === wanted)
    const [entry, group] = entryOf(number) ?? []
    const state = entry && stateOf(entry, group)
    const status = state === undefined ? [] : statusOf(entry, state)
    const label = labelOf({ blockers: [], ...entry, labels: task.labels }, state)
    const updated = new Date(task.updatedAt)
    const meta = el('div', 'dk-detail__meta caption',
      ...(status.length === 0 ? [] : [glyphed(el('span', `dk-badge caption is-${state}`, ...status), PLATE[state][1])]),
      ...(reports.some(report => report.evidence.length > 0) ? [glyphed(el('span', 'dk-badge caption is-evidence', '验收证据'), CHECK)] : []),
      ...(label === undefined ? [] : [el('span', 'dk-tag', label)]),
      el('span', '', task.assignees.join(', ') || '未指派'),
      el('span', '', task.isOpen ? `更新 ${pad(updated.getMonth() + 1)}-${pad(updated.getDate())}` : `关闭 ${shortTime(task.closedAt)}`))
    const section = (head, ...content) => el('section', 'dk-section', el('header', 'dk-section__head label', ...head), ...content)
    const why = said => el('span', 'dk-why caption', said)
    // Each Task blocking it, drawn by its own state; clicked, the way goes on
    // into it.
    const blockers = (entry?.blockers ?? []).map(entryOf).map(([blocker, its]) => {
      const itsState = stateOf(blocker, its)
      const glyph = glyphed(el('span', ''), PLATE[itsState][1])
      glyph.setAttribute('role', 'img')
      glyph.setAttribute('aria-label', PLATE[itsState][0])
      const edge = el('div', `dk-edge is-${itsState}`, glyph, el('span', `dk-id is-${itsState}`, `#${blocker.number}`), el('span', '', blocker.title))
      edge.addEventListener('click', () => openTask(blocker.number))
      return edge
    })
    // A report's Session: one of this Host by its cut-short id, this one
    // too, one of the other Host after the Host's name.
    const reporter = report => `${report.sessionHost === session.sessionHost ? 'Session' : HOST_NAME[report.sessionHost]} ${report.sessionShort}`
    const open = el('button', 'dk-btn dk-btn--sm dk-btn--quiet', '在 GitHub 打开')
    open.type = 'button'
    // Through the Host, which opens it in the browser: the page holds no link.
    open.addEventListener('click', () => request('ui/open-link', { url: task.url }))

    const closeout = entry?.isPendingCloseout ? [closeoutButton(closeoutOf(number), 'dk-btn dk-btn--sm dk-btn--unlock')] : []

    return {
      // The actions its row has, then the link: a ready Task is executed, a
      // held one released or taken over; a Spec or Map is neither, a Pending
      // Closeout one has its closeout.
      end: [
        ...(entry?.kind !== undefined ? []
          : state === 'ready' ? [executeButton(number, '执行', 'dk-btn dk-btn--sm dk-btn--go')]
          : heldActions(entry, state, 'detail')),
        ...closeout,
        open,
      ],
      body: [el('div', 'dk-detail',
        el('div', 'dk-detail__title title', el('span', `dk-id${state === undefined ? '' : ` is-${state}`}`, `#${task.number}`), el('span', '', task.title)),
        meta,
        section(['描述'], task.description === '' ? why('没有描述。') : el('div', 'dk-prose', el('p', '', task.description))),
        section(['验收条件'], task.acceptance.length === 0
          ? why('正文里没有验收条件。')
          : el('div', 'dk-prose', el('ul', '', ...task.acceptance.map(item => el('li', item.isChecked ? 'is-checked' : '', item.text))))),
        ...(blockers.length === 0 ? [] : [section(['被阻塞', el('span', 'mono', String(blockers.length))], ...blockers)]),
        section(['执行记录'], reports.length === 0
          ? why('还没有 Session 执行过这个 Task。')
          : el('div', 'dk-log', ...reports.map(report => el('div', 'dk-log__item',
              el('div', 'dk-log__who', el('span', '', reporter(report)), el('span', '', shortTime(report.reportedAt))),
              el('span', 'dk-log__text', report.result),
              ...report.evidence.map(each => glyphed(el('span', 'is-pass caption', `验收证据：${each.text}（来自 ${each.source}）`), CHECK)))))),
      )],
    }
  }

  // The Map Views the Deck service gave with the last list, open ones
  // first; the one the "地图" tab shows, by number, else the first; whether
  // the tab lists them to switch to instead; whether the wall shows every
  // blocked Child Task. Kept here: each read draws the tab anew.
  let maps
  let mapShown
  let isSwitching = false
  let isWallOpen = false

  const refs = numbers => numbers.map(number => `#${number}`).join(' ')

  // The closeout check of the Pending Closeout Spec `number`, as its Map View
  // read with the list gives it; none where deck_map answered from a read
  // that found it no Pending Closeout.
  const closeoutOf = number => maps.find(map => map.number === number)?.closeoutPrompt ?? null
  // "收尾核对", which puts the closeout check in the prompt, off with none; on
  // a row, it is no click on the row.
  const closeoutButton = (prompt, className) => {
    const button = el('button', className, '收尾核对')
    button.type = 'button'
    button.disabled = prompt === null
    button.addEventListener('click', event => {
      event.stopPropagation()
      prefill(button, prompt)
    })
    return button
  }
  const CARD_STATE = { ready: '可执行', running: '进行中', other: '进行中', orphaned: 'Orphaned', blocked: '阻塞', closed: '已解锁' }
  // The card's four counts: the group, its glyph, its name.
  const COUNTS = [['ready', 'ready', '可执行'], ['inProgress', 'running', '进行中'], ['blocked', 'blocked', '阻塞'], ['done', 'closed', '已解锁']]

  // The card naming the Spec or Map: its kind and number, "切换" when there
  // is another, its title and goal, its Child Tasks counted by group, and
  // its progress.
  const mapCard = map => {
    const head = el('div', 'dk-spec__head', el('span', 'dk-kind label', map.kind === 'spec' ? 'Spec' : 'Map'), el('span', `dk-id is-${containerState(map)}`, `#${map.number}`),
      ...(map.isPendingCloseout ? [el('span', 'is-unlock caption', '待收尾核对')] : []))
    if (maps.length > 1) {
      const switching = smallButton('切换')
      switching.addEventListener('click', () => {
        isSwitching = true
        showMap()
      })
      head.append(' ', switching)
    }
    const counts = COUNTS.map(([group, glyph, name]) => {
      const badge = el('span', `dk-badge caption is-${glyph}`, `${name} ${map.wall.filter(card => card.group === group).length}`)
      badge.insertAdjacentHTML('afterbegin', `<svg viewBox="0 0 16 16" aria-hidden="true">${PLATE[glyph][1]}</svg>`)
      return badge
    })
    const { closed, inProgress, total } = map.progress
    const share = count => (total === 0 ? 0 : (100 * count) / total)
    const bars = [['dk-progress__closed', closed], ['dk-progress__active', inProgress]].map(([className, count]) => {
      const bar = el('i', className)
      bar.style.width = `${share(count).toFixed(2)}%`
      return bar
    })
    const progress = el('div', `dk-progress${map.isPendingCloseout ? ' is-complete' : ''}`,
      el('div', 'dk-progress__head', el('span', 'label', '解锁进度'), el('span', 'dk-progress__nums', el('span', 'dk-progress__count display', `${closed} / ${total}`), el('span', 'dk-progress__pct caption', `${Math.round(share(closed))}%`))),
      el('div', 'dk-progress__track', ...bars))
    progress.setAttribute('role', 'progressbar')
    progress.setAttribute('aria-label', '解锁进度')
    progress.setAttribute('aria-valuemin', '0')
    progress.setAttribute('aria-valuemax', String(total))
    progress.setAttribute('aria-valuenow', String(closed))
    return el('article', `dk-spec${map.isPendingCloseout ? ' is-closeout' : ''}`, head, el('span', 'dk-spec__title title', map.title),
      ...(map.goal === null ? [] : [el('span', 'dk-spec__goal', map.goal)]),
      el('div', 'dk-spec__stats', ...counts), progress,
      ...(map.isPendingCloseout ? [el('div', 'dk-spec__foot caption', el('span', '', 'Child Task 已全部解锁，Spec 还没关闭。'), closeoutButton(map.closeoutPrompt, 'dk-btn dk-btn--unlock'))] : []))
  }

  // A Child Task's card: its glyph, number and state; its title; what blocks
  // it and what it blocks, else who holds it or whether it has Acceptance
  // Evidence; when it was updated, or closed.
  const wallCard = card => {
    const state = stateOf(card, card.group)
    // Asked to take it over, the card's place holds the asking.
    if (isAsked(card, state, 'map')) return takeOverAsk(card, state)
    const edges = [
      ...(card.blockers.length > 0 ? [`被 ${refs(card.blockers)} 阻塞`] : []),
      ...(card.blocking.length > 0 ? [`挡着 ${refs(card.blocking)}`] : []),
    ]
    const relation = edges.length > 0 ? [edges.join(' · ')]
      : state === 'other' ? [...(card.occupantHost === session.sessionHost ? [] : [HOST_NAME[card.occupantHost]]), el('span', 'mono', card.occupantShort)]
      : state === 'orphaned' ? ['Session 已结束']
      : state === 'closed' ? [card.hasEvidence ? glyphed(el('span', 'is-pass', '验收证据'), CHECK) : '没有验收证据']
      : [' ']
    const glyph = plate(state)
    glyph.classList.add('dk-plate--sm')
    return el('article', `dk-card is-${state}`,
      el('div', 'dk-card__head', glyph, el('span', `dk-id is-${state}`, `#${card.number}`), el('span', 'dk-card__state caption', CARD_STATE[state])),
      el('span', 'dk-card__title heading', card.title),
      el('span', 'dk-card__meta caption', ...relation),
      el('div', 'dk-card__foot caption', el('span', '', state === 'closed' ? shortTime(card.closedAt) : `更新 ${shortTime(card.updatedAt).slice(0, 5)}`),
        // The action its row in "任务" has, an Orphaned one's "接管" alone,
        // its "释放" in the detail: none for a Spec or Map.
        ...(card.kind !== undefined ? []
          : state === 'ready' ? [executeButton(card.number, '执行', 'dk-btn dk-btn--sm dk-btn--go')]
          : state === 'orphaned' ? [takeOverButton(card.number, 'map')]
          : heldActions(card, state, 'map'))))
  }

  // The "地图" tab: the Map View shown, its blocked Child Tasks past three
  // behind a button, or the Specs and Maps to switch to.
  const showMap = () => {
    const map = maps.find(each => each.number === mapShown) ?? maps[0]
    // The one drawn is the one shown from now on, chosen or not; one gone
    // from the answer gives way to the first, its wall closed.
    if (map?.number !== mapShown) isWallOpen = false
    mapShown = map?.number
    $('map-empty').hidden = map !== undefined
    if (map === undefined) {
      // With nothing to switch between, the list to switch to is closed.
      isSwitching = false
      $('map-view').replaceChildren()
    } else if (isSwitching) {
      const back = smallButton('返回')
      back.addEventListener('click', () => {
        isSwitching = false
        showMap()
      })
      const choices = maps.map(each => {
        const choice = containerRow(each, [], () => openMap(each.number))
        choice.classList.toggle('is-selected', each === map)
        return choice
      })
      $('map-view').replaceChildren(el('div', 'dk-bar', back, el('span', 'dk-crumbs', '地图 /', el('b', '', '切换'))), el('ul', 'dk-list', ...choices))
    } else {
      const unshown = isWallOpen ? [] : map.wall.filter(card => card.group === 'blocked').slice(3)
      const more = el('button', 'dk-group__more caption', `还有 ${unshown.length} 个被阻塞`)
      more.type = 'button'
      more.addEventListener('click', () => {
        isWallOpen = true
        showMap()
      })
      $('map-view').replaceChildren(mapCard(map), el('div', 'dk-wall', ...map.wall.filter(card => !unshown.includes(card)).map(wallCard)), ...(unshown.length === 0 ? [] : [more]))
    }
  }

  // Into a Map View, from a row of "任务" or from the list to switch to: the
  // "地图" tab shows the Spec or Map `number`. Back from it is the "任务" tab,
  // its filter as it was.
  const openMap = number => {
    if (number !== mapShown) isWallOpen = false
    mapShown = number
    showMap()
    selectTab('map')
  }

  // Reads the Tasks, the Task Source again when `refresh` asks for it, then
  // their Map Views from that read. A read that fails says why, in "任务" and
  // in "地图", above what was read before, if anything.
  // Answers whether the Tasks were read.
  const readTasks = async refresh => {
    let failure
    try {
      const answer = await callTool('deck_tasks', refresh ? { refresh: true } : {})
      const viewed = answer.ok ? await callTool('deck_map', { session: session.session }) : answer
      if (viewed.ok) {
        list = answer
        maps = viewed.maps
        // The Task asked to be taken over is asked no more once no other
        // Session holds it: released, closed, gone, or this Session's by now.
        const found = takeover === undefined ? undefined : entries().find(([each]) => each.number === takeover.number)
        if (found === undefined || !['other', 'orphaned'].includes(stateOf(...found))) takeover = undefined
      } else {
        failure = FAILURE[viewed.failure.kind](viewed.failure.message)
      }
    } catch (error) {
      failure = [`Deck 服务出错：${error.message}。点“刷新”重试。`]
    }
    $('tasks-loading').hidden = $('map-loading').hidden = true
    for (const notice of [$('tasks-failed'), $('map-failed')]) {
      notice.hidden = failure === undefined
      if (failure !== undefined) {
        notice.querySelector('.dk-notice__text').replaceChildren(...failure.map(part => (typeof part === 'string' ? part : part.cloneNode(true))))
      }
    }
    readAt = failure === undefined ? Date.now() : 'failed'
    showFreshness()
    if (list !== undefined) {
      showTasks()
      showMap()
    }
    showRecommendation()
    return failure === undefined
  }

  // The call of the configure skill, as the Deck service gives it, read with
  // the config of a project that is not configured, and with the skills.
  let configureCall

  // Whether the skills were read since the page opened, or since a read found
  // the project not configured. A timed read, or the read as the tab is shown
  // again, reads them only while it is false; "刷新" reads them again whatever
  // it is.
  let skillsRead = false
  // The skills the last read of the Skill Source listed.
  let skillsListed = []
  // The read of the skills asked for last: only its answer is shown, and an
  // earlier one answering after it is dropped.
  let skillsAsked

  // The reads asked for, one after another: each begins once the one before
  // it has ended, and "刷新" is off until the last has. Each answers whether
  // the project config and the Session were read, and the Tasks too in a
  // Configured Project.
  let reading = Promise.resolve()
  const read = async (refresh = false) => {
    $('refresh').disabled = true
    const before = reading
    let ended
    const asked = (reading = new Promise(resolve => {
      ended = resolve
    }))
    await before
    try {
      const [config, named] = await Promise.all([callTool('deck_config'), callTool('deck_session')])
      session = named
      // In a Configured Project, the page says Deck's hook may not run while
      // no call from it was received: Codex runs it only once the person
      // trusted it, and until then a sent $implement records no Occupancy.
      // Where the Deck service cannot say, the page says nothing of the
      // hook and reads the rest as usual: the Tasks' own read says why the
      // local state cannot be read.
      const hook = config.configured ? await callTool('deck_hook').catch(() => undefined) : undefined
      // Configured again, the project's skills are read again; until that
      // read answers, what an earlier one said of implement no longer holds,
      // a read still out included, and every "执行" is off, whether or not
      // the Deck service gives the configure skill's call.
      if (!config.configured) {
        skillsRead = false
        skillsAsked = undefined
        implement = undefined
        showExecutable()
        configureCall = (await callTool('deck_configure')).call
      }
      $('project').firstElementChild.textContent = config.workspace.slice(config.workspace.lastIndexOf('/') + 1)
      $('session').querySelector('b').textContent = session.sessionShort
      $('project').hidden = $('session').hidden = false
      $('loading').hidden = $('failed').hidden = true
      $('tabs').hidden = !config.configured
      $('hook').hidden = !config.configured || hook?.receivedAt !== null
      $('unconfigured').hidden = config.configured
      showPanel()
      // A list read before keeps its freshness until the next read answers.
      if (!config.configured || list === undefined) {
        readAt = undefined
        showFreshness()
      }
      let tasksRead = true
      if (config.configured) {
        tasksRead = await readTasks(refresh)
        // Read again, the page no longer says a request was not made.
        if (refresh) asking = { ...asking, failure: undefined }
        // Every tab's "执行" goes by the skills: they are read with the first
        // read of the Tasks, and again with "刷新".
        if (refresh || !skillsRead) await readSkills()
        // A step drawn from the Tasks draws again with each read of them;
        // every step with "刷新", after what it is drawn from is read again.
        if (refresh || into?.steps.at(-1).withTasks) await drawStep()
      }
      return tasksRead
    } catch (error) {
      $('failed').querySelector('.dk-notice__text').textContent = `Deck 服务出错：${error.message}。点“刷新”重试。`
      $('loading').hidden = true
      $('failed').hidden = false
      readAt = 'failed'
      showFreshness()
      return false
    } finally {
      ended()
      if (reading === asked) $('refresh').disabled = false
    }
  }

  // Puts the text in the Session's prompt for the person to send (ADR-0006).
  // The page never sends a message itself: the Host hands what a page sends
  // to the agent as untrusted input, and no skill runs.
  const fill = text =>
    request('ui/message', {
      role: 'user',
      content: [{ type: 'text', text }],
      _meta: { 'openai/message': { target: 'active', send: false } },
    })
  // Fills in the text from the button, which is off from the click and stays
  // off for 5 seconds once it is filled in, so a second click fills in no
  // second copy.
  const prefill = async (button, text) => {
    const label = button.textContent
    button.disabled = true
    try {
      await fill(text)
      button.textContent = '已填入'
      await new Promise(resolve => setTimeout(resolve, 5_000))
    } finally {
      button.textContent = label
      button.disabled = false
    }
  }

  // implement as the last read of the skills lists it: undefined before the
  // first, or since a read found the project not configured, null where it
  // listed none, { failure } where the read failed.
  // "执行" is on only where Codex finds the Skill Source's own file.
  let implement
  // The Tasks whose Execute Prompt is being filled in, false, or was in the
  // last 5 seconds, true, by number. Every "执行" of theirs, drawn before or
  // since, is off meanwhile, so no second copy goes in the prompt.
  const filling = new Map()

  // A "执行" of the Task `number`, which the page draws again as "执行"
  // stands: it fills in the Execute Prompt the Deck service gives, never
  // sends it, and occupies nothing; the hook does, once the person sends it.
  // A button whose click ends in that prompt another way, `onClick`, is
  // drawn as "执行" stands too.
  const executeButton = (number, label, className, onClick = () => execute(number)) => {
    const button = el('button', className, label)
    button.type = 'button'
    button.dataset.execute = String(number)
    button.dataset.label = label
    drawExecute(button)
    // Not a click on the row it is in.
    button.addEventListener('click', event => {
      event.stopPropagation()
      onClick()
    })
    return button
  }
  const drawExecute = button => {
    const filled = filling.get(Number(button.dataset.execute))
    button.disabled = filled !== undefined || implement?.copy !== 'same'
    button.textContent = filled === true ? '已填入' : button.dataset.label
  }
  // `before` runs first, every "执行" of the Task off meanwhile; answering
  // false, nothing is filled in.
  const execute = async (number, before = async () => true) => {
    filling.set(number, false)
    showExecutable()
    try {
      if (!(await before())) return
      await fill((await callTool('deck_execute', { task: number })).prompt)
      filling.set(number, true)
      showExecutable()
      await new Promise(resolve => setTimeout(resolve, 5_000))
    } catch {
      // Not given or not filled in, nothing is in the prompt: "执行" is on
      // again to be clicked once more.
    } finally {
      filling.delete(number)
      showExecutable()
    }
  }

  // Taking over and releasing (docs/codex-tab-layout.md, "接管确认"). The
  // takeover the person is asked to confirm: the Task's number, the place it
  // was asked in ('tasks', 'map', 'detail', 'next'), why the last "接管"
  // moved nothing, if it did not, and which of its buttons has the focus,
  // 'confirm' or 'cancel', if one does. Kept here: each read draws the
  // places anew, and a button off as it is drawn cannot take the focus.
  // While "接管" moves the Occupancy, `moving` is true.
  let takeover
  // The focus the person moves onto the asking's buttons, or elsewhere.
  document.addEventListener('focusin', event => {
    if (takeover !== undefined) takeover.focus = event.target.dataset?.takeover
  })
  // Moved off the asking's button onto nothing in the page, a blank of it or
  // outside it, the focus is not put back. A button drawn anew, or off, is
  // left by the page, not the person.
  document.addEventListener('focusout', event => {
    const left = event.target
    if (event.relatedTarget !== null || left.dataset?.takeover === undefined || left.disabled) return
    queueMicrotask(() => {
      if (takeover !== undefined && left.isConnected) takeover.focus = undefined
    })
  })
  // Whether the Task, in the state it is in, is asked to be taken over in
  // the place: only while another Session holds it, or it is Orphaned.
  const isAsked = (task, state, place) =>
    takeover?.number === task.number && takeover.place === place && (state === 'other' || state === 'orphaned')
  // Every place the asking can be in, drawn as it now stands.
  const showTakeOver = () => {
    showTasks()
    showMap()
    showRecommendation()
    if (into !== undefined) showStep(into.steps.at(-1))
  }
  const askTakeOver = (number, place) => {
    takeover = { number, place, focus: 'cancel' }
    showTakeOver()
  }
  const closeTakeOver = () => {
    if (takeover === undefined) return
    takeover = undefined
    showTakeOver()
  }
  // "接管": asks, in the place it is in, to take the Task over. Off as
  // "执行" is: the Execute Prompt follows the takeover.
  const takeOverButton = (number, place) => executeButton(number, '接管', 'dk-btn dk-btn--sm', () => askTakeOver(number, place))
  // "释放": releases the Occupancy the Session `holder` has of the Task, and
  // asks nothing.
  const releaseButton = (number, holder) => {
    const button = smallButton('释放')
    button.addEventListener('click', event => {
      event.stopPropagation()
      release(number, holder)
    })
    return button
  }

  // The asking, in the place of the Task's row, card or button: who executes
  // it, then "接管" and "取消". Just asked, the focus goes onto "取消"; drawn
  // anew, it stays on the button of the asking it was on.
  const takeOverAsk = (task, state) => {
    const glyph = plate(state)
    glyph.classList.add('dk-plate--sm')
    const title =
      state === 'orphaned'
        ? [`#${task.number} 的 Session 已结束`]
        : [`#${task.number} 正由 ${task.occupantHost === session.sessionHost ? 'Session' : HOST_NAME[task.occupantHost]}`, el('span', 'mono', task.occupantShort), '执行']
    let said = ['接管会把 Occupancy 转给本 Session。']
    if (takeover.failure !== undefined) {
      // The reason in the Pane's words, and the hint that holds here: not
      // "刷新", which moves nothing, but "接管" again.
      const { kind, message } = takeover.failure
      said = FAILURE[kind]?.(message) ?? [`Deck 服务出错：${message}。点“刷新”重试。`]
      said.push(said.pop().replace(/点“刷新”重试。$/, '再点“接管”重试。'))
    }
    const confirm = executeButton(task.number, '接管', 'dk-btn', () => takeOver(task.number, task.occupant))
    const cancel = el('button', 'dk-btn dk-btn--quiet', '取消')
    cancel.type = 'button'
    // Off with "接管" while the Occupancy moves: closed then, it would move all
    // the same.
    cancel.disabled = takeover.moving === true
    cancel.addEventListener('click', closeTakeOver)
    confirm.dataset.takeover = 'confirm'
    cancel.dataset.takeover = 'cancel'
    const focus = { confirm, cancel }[takeover.focus]
    // Once it is in the page, which the caller puts it in; "接管" off then
    // takes it as it is on again.
    if (focus !== undefined) queueMicrotask(() => focus.focus())
    const words = el('span', 'dk-notice__text')
    words.replaceChildren(...said)
    const notice = el(
      'div',
      'dk-notice is-warn',
      glyph,
      el('div', 'dk-notice__body', el('span', 'dk-notice__title heading', ...title), words, el('div', 'dk-notice__actions', confirm, cancel)),
    )
    notice.setAttribute('role', 'status')
    return notice
  }

  // Takes the Task `number` over from the Session `from`, as the person
  // confirmed: the Occupancy moves to this Session at once, the Tasks are
  // read again, and the Execute Prompt is filled in as "执行" fills it in.
  // Not moved, nothing is filled in: the asking says why, or closes where the
  // Task is closed or gone, or held by a third Session by now, as the Tasks
  // read again show.
  const takeOver = (number, from) =>
    // A button of an asking closed since, still in the page, does nothing.
    takeover === undefined ? undefined : execute(number, async () => {
      takeover.moving = true
      showTakeOver()
      let answer
      try {
        answer = await callTool('deck_occupy', { session: session.session, task: number, takeOver: from })
      } catch (error) {
        answer = { ok: false, failure: { message: error.message } }
      }
      // Drawn at once, why or closed, then as the Tasks are read again.
      if (takeover?.number === number) {
        takeover = answer.ok || answer.failure.kind === 'not-open' ? undefined : { ...takeover, moving: false, failure: answer.failure }
        showTakeOver()
      }
      // Not moved, "接管" is on again at once: the Tasks are read again
      // behind any read under way, which it does not wait for.
      const readAgain = read()
      if (!(answer.ok && answer.occupied)) return false
      // Read again, the project may be not configured by now, or implement
      // not the same copy: nothing is filled in then. A read that fails
      // cannot say: nothing is filled in either, and the next read that
      // answers draws the Task as this Session's.
      return (await readAgain) && implement?.copy === 'same'
    })

  // Releases the Occupancy the Session `holder` has of the Task `number`,
  // then reads the Tasks again, which show it in the group it is in now.
  // One that passed to another Session since stays with it.
  const release = async (number, holder) => {
    try {
      await callTool('deck_release', { task: number, session: holder })
    } catch {
      // Not released, the Tasks read again show it held still.
    }
    await read()
  }

  // Why "执行" is off, said once at the top of the 任务 and 地图 tabs, and
  // every "执行" as it stands.
  const UNEXECUTABLE = { different: 'Codex 里的 implement 不是同一份，不能预填执行。', missing: 'Codex 里找不到 implement，不能预填执行。' }
  const UNTIL_RERUN = '所有 Task 的“执行”先停用，重跑配置之后恢复。'
  const showExecutable = () => {
    const why =
      implement === undefined || implement?.copy === 'same' ? undefined
      : implement === null ? ['Skill Source 里没有 implement，不能预填执行。', UNTIL_RERUN]
      : implement.failure !== undefined ? ['读取 Skill Source 失败，不能预填执行。', skillFailure(implement.failure)]
      : [UNEXECUTABLE[implement.copy], UNTIL_RERUN]
    for (const notice of [$('tasks-noexec'), $('map-noexec')]) {
      notice.hidden = why === undefined
      if (why !== undefined) {
        notice.querySelector('.dk-notice__title').textContent = why[0]
        notice.querySelector('.dk-notice__text').textContent = why[1]
        // Drawn anew, as the 技能 tab's: off while the Deck service has given
        // no call of the configure skill.
        const rerun = smallButton('重跑配置')
        rerun.disabled = configureCall === undefined
        rerun.addEventListener('click', () => prefill(rerun, configureCall))
        const line = notice.querySelector('.dk-notice__line')
        line.replaceChildren(line.firstElementChild, rerun)
      }
    }
    for (const button of document.querySelectorAll('[data-execute]')) drawExecute(button)
    // The asking's "接管" the focus was on, off until now, takes it again.
    const focus = takeover?.focus === undefined ? null : document.querySelector(`[data-takeover="${takeover.focus}"]`)
    if (focus !== null && !focus.disabled && document.activeElement !== focus) focus.focus()
  }

  const smallButton = (label, className = '') => {
    const button = el('button', `dk-btn dk-btn--sm ${className}`.trim(), label)
    button.type = 'button'
    return button
  }
  const failedNotice = (title, text) => {
    const notice = el(
      'div',
      'dk-notice is-danger',
      $('failed').querySelector('.dk-plate').cloneNode(true),
      el('div', 'dk-notice__body', el('span', 'dk-notice__title heading', title), el('span', 'dk-notice__text', text)),
    )
    notice.setAttribute('role', 'status')
    return notice
  }

  // Why the Skill Source cannot be read, as the Deck service names it. Only
  // a reason the Pane has no words of its own for carries the service's.
  const skillFailure = ({ kind, message }) =>
    kind === 'missing'
      ? '找不到 Skill Source。重跑配置之后恢复。'
      : kind === 'unknown-skill'
        ? 'Skill Source 里已经没有这个技能。点“刷新”重新读取。'
        : `Deck 服务出错：${message}。点“刷新”重试。`

  // Codex finds a skill by its name in its own skill directories; a call it
  // finds another file for, or none, runs no skill of the Skill Source.
  const UNPREFILLABLE = { different: 'Codex 里的不是同一份，不能预填。', missing: 'Codex 里找不到，不能预填。' }
  const prefillButton = skill => {
    const button = smallButton('预填', 'dk-btn--go')
    button.disabled = skill.copy !== 'same'
    button.addEventListener('click', event => {
      event.stopPropagation()
      prefill(button, skill.call)
    })
    return button
  }

  // A skill's text, entered from its row, with its "预填" at the end of the
  // bar (see "Entering and going back"), on or off by what the last read of
  // the skills says of it: a skill no longer listed is found by Codex no more.
  const openSkillText = skill => {
    enter({
      crumb: skill.call,
      draw: () => drawSkillText(skill),
      drawn: { end: [prefillButton(skill)], body: [el('p', 'dk-why', '正在读取技能…')] },
    })
  }

  const drawSkillText = async skill => {
    const prefillIt = prefillButton(skillsListed.find(each => each.name === skill.name) ?? { ...skill, copy: 'missing' })
    let body
    try {
      const answer = await callTool('deck_skill', { name: skill.name })
      body = answer.ok
        ? el(
            'div',
            'dk-detail',
            el('div', 'dk-detail__title title', el('span', 'dk-skill__name mono', answer.skill.call)),
            el('span', 'dk-why mono', answer.skill.path),
            el('div', 'dk-prose dk-raw', answer.skill.text),
          )
        : failedNotice('读取技能失败', skillFailure(answer.failure))
    } catch (error) {
      body = failedNotice('读取技能失败', skillFailure({ message: error.message }))
    }
    return { end: [prefillIt], body: [body] }
  }

  const skillRow = skill => {
    const row = el(
      'li',
      'dk-skill',
      el(
        'div',
        'dk-skill__main',
        el('span', 'dk-skill__name mono', skill.call),
        el('span', 'dk-skill__desc caption', skill.description),
        ...(skill.copy === 'same' ? [] : [el('span', 'dk-why caption', UNPREFILLABLE[skill.copy])]),
      ),
      el('span', 'dk-skill__actions', prefillButton(skill), smallButton('原文')),
    )
    row.tabIndex = 0
    // A click on the row or on "原文" opens the skill's text.
    row.addEventListener('click', () => openSkillText(skill))
    return row
  }

  const skillGroup = (label, count, skills) =>
    el(
      'section',
      'dk-group',
      el('header', 'dk-group__head', el('span', 'label', label), ...(count === undefined ? [] : [el('span', 'dk-group__count mono', String(count))])),
      el('ul', 'dk-list', ...skills.map(skillRow)),
    )

  // The skills of the Skill Source as the Deck service lists them, by name;
  // $ask-matt is the general entry.
  const showSkills = answer => {
    if (!answer.ok) {
      // Unread, no skill is known to be the same file Codex finds.
      skillsListed = []
      $('skill-list').replaceChildren(failedNotice('读取 Skill Source 失败', skillFailure(answer.failure)))
      return
    }
    const { source, skills } = answer
    skillsListed = skills
    const shown = [
      el(
        'div',
        'dk-source caption',
        el('span', '', 'Skill Source'),
        el('span', 'mono', source.type === 'plugin' ? `插件 ${source.name}` : `目录 ${source.path}`),
      ),
    ]
    const unprefillable = skills.filter(skill => skill.copy !== 'same').length
    if (unprefillable > 0) {
      const rerun = smallButton('重跑配置')
      rerun.disabled = configureCall === undefined
      rerun.addEventListener('click', () => prefill(rerun, configureCall))
      const notice = el(
        'div',
        'dk-notice is-warn',
        el(
          'div',
          'dk-notice__body',
          el('div', 'dk-notice__line', el('span', 'dk-notice__title heading', `${unprefillable} 个技能在 Codex 里不能预填。`), rerun),
          el('span', 'dk-notice__text', '原因写在各自那一行，重跑配置之后恢复。'),
        ),
      )
      notice.setAttribute('role', 'status')
      shown.push(notice)
    }
    const general = skills.filter(skill => skill.name === 'ask-matt')
    const others = skills.filter(skill => skill.name !== 'ask-matt')
    if (general.length > 0) shown.push(skillGroup('通用入口', undefined, general))
    shown.push(skillGroup('技能', others.length, others))
    $('skill-list').replaceChildren(...shown)
  }

  const readSkills = async () => {
    skillsRead = true
    const asked = (skillsAsked = {})
    const [read, configure] = await Promise.allSettled([callTool('deck_skills'), callTool('deck_configure')])
    if (asked !== skillsAsked) return
    // The call every "重跑配置" fills in; one not given leaves the one given
    // before, if any, and with none they are off.
    if (configure.status === 'fulfilled') configureCall = configure.value.call
    if (read.status === 'fulfilled') {
      const answer = read.value
      showSkills(answer)
      askMatt = answer.ok ? (answer.skills.find(skill => skill.name === 'ask-matt') ?? null) : null
      implement = answer.ok ? (answer.skills.find(skill => skill.name === 'implement') ?? null) : { failure: answer.failure }
    } else {
      skillsListed = []
      $('skill-list').replaceChildren(failedNotice('读取 Skill Source 失败', skillFailure({ message: read.reason.message })))
      askMatt = null
      implement = { failure: { message: read.reason.message } }
    }
    showNext()
    showExecutable()
  }

  // The 技能 tab shows the list the skills were last read into: opened before
  // the read of the Pane has read them, it reads them.
  const showSkillsTab = async () => {
    if (!skillsRead) await readSkills()
  }

  // ask-matt as the last read of the skills lists it: undefined before the
  // first, null where the read failed or listed none, and then deck_ask
  // says why it cannot make the request.
  let askMatt
  const UNASKABLE = { different: 'Codex 里的 ask-matt 不是同一份，不能预填。', missing: 'Codex 里找不到 ask-matt，不能预填。' }

  // The Recommendation Request of this tab, the last one asked: none yet,
  // waiting for the agent's report, answered, or stopped after 10 minutes.
  // Only the last one is waited for. `again` says it was asked while
  // another waited; `failure`, why the last ask made none.
  let asking = { phase: 'none' }
  let waitingFor

  // Asks the Deck service for a Recommendation Request and prefills it, then
  // reads its Recommendation every 2 seconds, for 10 minutes at most.
  const ask = async button => {
    button.disabled = true
    let answer
    try {
      answer = await callTool('deck_ask')
    } catch (error) {
      answer = { ok: false, failure: { message: error.message } }
    }
    if (!answer.ok) {
      asking = { ...asking, failure: answer.failure }
      showNext()
      return
    }
    const { requestId } = answer
    asking = { phase: 'waiting', requestId, again: asking.phase === 'waiting' }
    prefill(button, answer.prompt)
    showNext()
    clearInterval(waitingFor)
    const askedAt = Date.now()
    waitingFor = setInterval(async () => {
      if (Date.now() - askedAt >= 600_000) {
        clearInterval(waitingFor)
        asking = { phase: 'stopped' }
        showNext()
        return
      }
      let read
      try {
        read = await callTool('deck_recommendation', { requestId })
      } catch {
        return
      }
      // Only the request still waited for is answered by its read.
      if (asking.requestId !== requestId || !read.found) return
      clearInterval(waitingFor)
      asking = { phase: 'answered', recommendation: read.recommendation }
      showNext()
    }, 2_000)
  }

  // The Recommendation as the "下一个成就" card: the Task by its number, with
  // its glyph and title where the list read holds it; "无" for a field with
  // nothing in it.
  const recommendationCard = ({ task, nextStep, skill, reason, blockers }) => {
    const found = list === undefined ? undefined : entries().find(([each]) => each.number === task)
    const state = found === undefined ? undefined : stateOf(...found)
    const glyph = found === undefined ? [] : [plate(state)]
    glyph.forEach(each => each.classList.add('dk-plate--lg'))
    const title = found !== undefined ? found[0].title : task === null ? '无' : '任务列表里没有这个 Task'
    const field = (name, value) => [el('dt', 'caption', name), el('dd', '', value === '' ? '无' : value)]
    return el(
      'article',
      'dk-rec',
      el(
        'div',
        'dk-rec__head',
        ...glyph,
        el('div', 'dk-rec__titles', el('span', 'dk-rec__overline label', '下一个成就'), el('span', 'dk-rec__title title', title)),
        ...(task === null ? [] : [el('span', 'mono', `#${task}`)]),
      ),
      el(
        'dl',
        'dk-rec__fields',
        ...field('下一步', nextStep),
        ...field('技能', skill === '' ? '' : el('span', 'mono', skill)),
        ...field('理由', reason),
        ...field('阻塞', blockers),
      ),
      // Executed unless there is no Task, or it is closed; held by another
      // Session or Orphaned, this Session's own Orphaned Task included, after
      // the person confirms taking it over, asked in the button's place.
      ...(task === null || state === 'closed' ? []
        : found !== undefined && isAsked(found[0], state, 'next') ? [takeOverAsk(found[0], state)]
        : state === 'other' || state === 'orphaned' ? [executeButton(task, '执行这个 Task', 'dk-btn dk-btn--primary dk-btn--block', () => askTakeOver(task, 'next'))]
        : [executeButton(task, '执行这个 Task', 'dk-btn dk-btn--primary dk-btn--block')]),
    )
  }

  // The 下一步 tab as the request stands and the skills say: a read of the
  // skills draws it again. The timed reads leave it, its buttons too, but
  // for the Recommendation's card, drawn again from the list they read.
  const showNext = () => {
    const why = askMatt && askMatt.copy !== 'same' ? UNASKABLE[askMatt.copy] : undefined
    const askButton = (label, className) => {
      const button = el('button', className, label)
      button.type = 'button'
      button.disabled = askMatt === undefined || why !== undefined
      button.addEventListener('click', () => ask(button))
      return button
    }
    const primary = () => askButton('我现在该做什么', 'dk-btn dk-btn--primary dk-btn--block')
    const phases = (...states) =>
      el('div', 'dk-phases caption', ...['已填入', '等待回报', '已回答'].map((label, index) => el('span', `dk-phase ${states[index]}`.trim(), label)))
    const shown = []
    if (asking.failure !== undefined) {
      // The reason in the Pane's words, and the hint that holds here: not
      // "刷新", which makes no request, but the button this tab shows.
      const { kind, message } = asking.failure
      const reason = FAILURE[kind]?.(message) ?? [skillFailure({ kind, message })]
      const again = `再点“${asking.phase === 'waiting' || asking.phase === 'answered' ? '再问一次' : '我现在该做什么'}”重试。`
      reason.push(reason.pop().replace(/点“刷新”(?:重试|重新读取)。$/, again))
      const notice = failedNotice('没有填入推荐请求', '')
      notice.querySelector('.dk-notice__text').replaceChildren(...reason)
      shown.push(notice)
    }
    const hint = text => el('p', 'dk-next__hint caption', text)
    if (asking.phase === 'none') shown.push(primary(), ...(why === undefined ? [hint('把 $ask-matt 填进输入框，附带 Task Snapshot。')] : []))
    if (asking.phase === 'waiting') {
      shown.push(
        phases('is-done', 'is-now', ''),
        el('div', 'dk-next__line', el('span', '', asking.again ? '已重新填入。输入框里上一份还在的话，先删掉再发送。' : '已填入输入框，等你发送。'), askButton('再问一次', 'dk-btn')),
      )
    }
    if (asking.phase === 'answered') shown.push(phases('is-done', 'is-done', 'is-done'), recommendationCard(asking.recommendation))
    if (asking.phase === 'stopped') {
      shown.push(phases('is-done', 'is-cancelled', ''), hint('等了 10 分钟，没有收到回报，已停止等待。回答在对话里。'), primary())
    }
    if (why !== undefined) {
      const rerun = el('button', 'dk-btn', '重跑配置')
      rerun.type = 'button'
      rerun.disabled = configureCall === undefined
      rerun.addEventListener('click', () => prefill(rerun, configureCall))
      shown.push(el('div', 'dk-next__line', el('span', 'dk-why caption', why), rerun))
    }
    $('next').replaceChildren(el('div', 'dk-next', ...shown), ...(asking.phase === 'answered' ? [askButton('再问一次', 'dk-btn')] : []))
  }

  const showRecommendation = () => {
    $('next').querySelector('.dk-rec')?.replaceWith(recommendationCard(asking.recommendation))
  }

  // The 下一步 tab. It goes by the skills, to know whether Codex runs this
  // ask-matt: opened before the read of the Pane has read them, it reads them.
  const showNextTab = async () => {
    showNext()
    if (!skillsRead) await readSkills()
  }

  const tabs = [...$('tabs').querySelectorAll('[role="tab"]')]
  // The content of the tab chosen, in a Configured Project, or what is
  // entered from it.
  const showPanel = () => {
    const chosen = chosenTab()
    for (const panel of document.querySelectorAll('[data-panel]')) panel.hidden = $('tabs').hidden || into !== undefined || panel.dataset.panel !== chosen
    $('into').hidden = $('tabs').hidden || into === undefined
  }
  // A tab chosen leaves the way drilled in, and the list of Specs and Maps
  // to switch to.
  const selectTab = chosen => {
    for (const each of tabs) each.setAttribute('aria-selected', String(each.dataset.tab === chosen))
    into = undefined
    closeTakeOver()
    if (isSwitching) {
      isSwitching = false
      showMap()
    }
    showPanel()
    if (chosen === 'skills') showSkillsTab()
    if (chosen === 'next') showNextTab()
  }
  for (const tab of tabs) tab.addEventListener('click', () => selectTab(tab.dataset.tab))
  $('back').addEventListener('click', back)
  const howTo = $('hook').querySelector('button')
  howTo.addEventListener('click', () => {
    const steps = $('hook').querySelector('ol')
    steps.hidden = !steps.hidden
    howTo.textContent = steps.hidden ? '怎么做' : '收起'
  })
  $('refresh').addEventListener('click', () => read(true))

  // While the tab is shown the Pane reads every 60 seconds, and once as it
  // is shown again; never while a read is under way.
  const readIfShown = () => {
    if (document.visibilityState === 'visible' && !$('refresh').disabled) read()
  }
  setInterval(readIfShown, 60_000)
  document.addEventListener('visibilitychange', readIfShown)

  const configure = $('unconfigured').querySelector('button')
  configure.addEventListener('click', () => prefill(configure, configureCall))

  follow(
    (
      await request('ui/initialize', {
        appInfo: { name: 'matt-deck', version: '0.1.0' },
        appCapabilities: {},
        protocolVersion: '2026-01-26',
      })
    ).hostContext,
  )
  post({ method: 'ui/notifications/initialized', params: {} })
  await read()
})()
</script>
</body>
</html>
